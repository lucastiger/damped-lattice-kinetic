name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: fast tests
        run: pytest -q -m "not slow"
      # The quick pipeline exercises every script end to end at reduced L/N.  It cannot
      # reproduce the production claims -- the data it writes is marked quick=true and the
      # checker reports those claims as skipped -- so it runs WITHOUT --strict.  The full
      # pipeline is ~1 hour on one core and is deliberately not run in CI; see
      # reports/RUNTIME.md.
      - name: quick pipeline
        run: make data-quick
      - name: claims (non-strict, quick data)
        run: python scripts/check_claims.py --report reports/ci_report.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.python-version }}
          path: reports/

  slow:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: slow tests (reference equivalence at N=4096, lattice monodromy)
        run: pytest -q -m slow
