# The null vectors phi' and phat: localization, decay envelope, and the evidence that
# ker M0 is one-dimensional.  Hypothesis H3 of the note (exponential decay of phat, hence
# phat in L^1) is what licenses the L^1-against-L^infinity pairing in Lemma 4.1, and it is
# assumed, not proved; this experiment is the numerical support for it.

grid: {L: 200.0, N: 4096}
model: {mu: 1.0, gamma: 0.1, mu2: 0.0, couplings: [[1, 1.0]], template_width: 2.0}

run:
  phat: {normalization: minus2pi, seed: 0, iters: 80, shift: 1.0e-14}
  newton: {tol: 1.0e-12, maxit: 40}

  # (a) decay envelope and (d) the profiles behind Figure 4.  Each vector is divided by its
  #     own max-norm, then max(|f(xi)|, |f(-xi)|) is read at the nearest grid point.  The
  #     tails oscillate, so these numbers are NOT monotone in |xi|.
  decay:
    L: 200.0
    N: 4096
    c0: 0.88
    approach: {start: 0.881, stop: 0.890, step: 1.0e-3}
    c: 0.89
    stations: [0, 10, 20, 40, 80, 120, 199]
    profile_csv: data/05_null_profiles.csv

  # (b) fraction of discrete L2 mass inside |xi| < radius, and (c) the three smallest
  #     singular values of M0.  Both at N=2048: the SVD is O(N^3) with a large constant.
  localization: {L: 200.0, N: 2048, c0: 0.88, c: 0.89, radius: 20.0}
  singular_values: {L: 200.0, N: 2048, c0: 0.88, c: 0.89, count: 3}

  # (e) the exponential-weight diagnostic of Remark 3.5(2).  If phat were e^{-gamma xi/c}
  #     times phi' -- the weight that intertwines the differential parts of M0 and M0^T but
  #     not the shifts -- this ratio would be constant.  Across |xi| < window it would span
  #     e^{2 gamma window / c}; the recorded span is what is actually observed.
  weight_test: {window: 150.0, floor: 1.0e-12, envelope_width: 3.0,
                reflection_stations: [50, 100, 150, 190]}

quick:
  grid: {L: 60.0, N: 512}
  run:
    decay: {L: 60.0, N: 512, stations: [0, 10, 20, 40], profile_csv: data/05_null_profiles_quick.csv}
    localization: {L: 60.0, N: 512}
    singular_values: {L: 60.0, N: 512}
    weight_test: {window: 40.0, envelope_width: 3.0, reflection_stations: [20, 40]}
