# ============================================================================
# claims.yaml -- machine-checkable manifest of every number quoted in note.tex
#
# Each claim names a key path (separator "/") inside a JSON file under data/ that
# the experiment scripts must emit.  `scripts/check_claims.py` loads this file,
# resolves every key, and applies the test.
#
# kinds:
#   value : |x - value| <= abs_tol   (or  |x-value|/|value| <= rel_tol)
#   upper : x <= bound               (x is an error/residual)
#   order : |log10(|x|) - log10(|value|)| <= decades
#   bool  : x is exactly `value`
#   null  : x is null/None (quantity deliberately not resolved)
#
# `exact_replication: true` marks a claim that depends on reproducing the exact
# continuation procedure of the reference implementation; a failure there means the
# procedure drifted, not that the science is wrong.  Investigate before editing.
#
# Provenance: all reference values were produced by handoff/reference/*.py.
# Those marked  verified: rerun  were recomputed after a sandbox reset and matched;
# the rest are transcribed from the original investigation logs.
# ============================================================================
schema: 1

defaults:
  model: {mu: 1.0, gamma: 0.1}
  pairing: "discrete, <f,g>_h = h * sum_j f_j g_j"

claims:

