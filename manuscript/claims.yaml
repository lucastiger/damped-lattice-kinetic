   kind: upper, bound: 5.0e-10,
   note: "max over c in [0.5,0.90015] at N=4096. NOT 1e-12: the relative error peaks at
          1.8e-10 at c=0.89892, which is 1e-5 from c_hat1, where both sides of the identity
          have collapsed to 0.0747 -- 0.6% of their value at c=0.89 -- while the absolute
          disagreement there (1.3e-11, see ID-sweep-abs) is in line with the rest of the
          sweep. Away from c_hat1 the relative error is <= 7.3e-12, and <= 1e-13 up to
          c=0.89. The peak does not move with the inverse-iteration count, the seed, the
          Newton tolerance or the continuation path."}
